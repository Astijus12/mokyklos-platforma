[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    integration: integration testai su Flask test client
    api: REST API testai
    modelis: duomenų modelio testai
    auth: autentikacijos ir autorizacijos testai
