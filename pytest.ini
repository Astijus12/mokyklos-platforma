[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    integration: integration testai su Flask test client
    api: REST API testai
    modelis: duomenų modelio testai
    auth: autentikacijos ir autorizacijos testai
    postgres: testai, kuriems būtinas PostgreSQL (katalogas tests/postgres, reikia TEST_DATABASE_URL)
    migracijos: Alembic migracijų testai
filterwarnings =
    # Flask-Login 0.6.3 viduje naudoja pasenusią datetime.utcnow() – tai ne šio projekto kodas
    ignore:datetime.datetime.utcnow:DeprecationWarning:flask_login
