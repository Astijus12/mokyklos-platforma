services:
  - type: web
    name: mokyklos-platforma
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # Vienas darbinis procesas: jame veikia ir planuoklė (žr. wsgi.py), todėl ji nesidubliuoja
    startCommand: gunicorn --preload --workers 1 wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SISTEMOS_ADRESAS
        value: https://mokyklos-platforma-1.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHONIOENCODING
        value: utf-8
