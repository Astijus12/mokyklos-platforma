{% extends "base.html" %}

{% block title %}{% if mokinys %}Redaguoti mokinį{% else %}Naujas mokinys{% endif %}{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="{{ url_for('students.saraso') }}" class="text-sm text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 flex items-center gap-1">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        Atgal į mokinių sąrašą
    </a>
</div>

<h1 class="text-3xl font-bold text-slate-900 dark:text-white mb-8">
    {% if mokinys %}Redaguoti mokinį: {{ mokinys.pilnas_vardas }}{% else %}Naujas mokinys{% endif %}
</h1>

<div class="card max-w-3xl">
    <form method="POST" class="p-6 space-y-5">

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <div>
                <label class="form-label">Vardas <span class="text-red-500">*</span></label>
                <input type="text" name="vardas" required maxlength="80"
                       value="{{ mokinys.vardas if mokinys else '' }}"
                       class="form-input">
            </div>
            <div>
                <label class="form-label">Pavardė <span class="text-red-500">*</span></label>
                <input type="text" name="pavarde" required maxlength="80"
                       value="{{ mokinys.pavarde if mokinys else '' }}"
                       class="form-input">
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <div>
                <label class="form-label">Klasė <span class="text-red-500">*</span></label>
                <select name="klases_id" required class="form-input">
                    <option value="">— Pasirinkite klasę —</option>
                    {% for k in klases %}
                    <option value="{{ k.id }}"
                            {% if mokinys and mokinys.klases_id == k.id %}selected
                            {% elif pradine_klase and pradine_klase == k.id %}selected{% endif %}>
                        {{ k.pavadinimas }} ({{ k.mokslo_metai }})
                    </option>
                    {% endfor %}
                </select>
            </div>
            <div>
                <label class="form-label">Gimimo data</label>
                <input type="date" name="gimimo_data"
                       value="{{ mokinys.gimimo_data.strftime('%Y-%m-%d') if mokinys and mokinys.gimimo_data else '' }}"
                       class="form-input">
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <div>
                <label class="form-label">El. paštas</label>
                <input type="email" name="email"
                       value="{{ mokinys.email if mokinys else '' }}"
                       placeholder="vardas@email.lt"
                       class="form-input">
            </div>
            <div>
                <label class="form-label">Telefonas</label>
                <input type="tel" name="telefonas"
                       value="{{ mokinys.telefonas if mokinys else '' }}"
                       placeholder="+370 600 00000"
                       class="form-input">
            </div>
        </div>

        <div>
            <label class="form-label">Adresas</label>
            <input type="text" name="adresas" maxlength="200"
                   value="{{ mokinys.adresas if mokinys else '' }}"
                   placeholder="pvz., Vilniaus g. 15, Vilnius"
                   class="form-input">
        </div>

        <div>
            <label class="form-label">Pastabos</label>
            <textarea name="pastabos" rows="3"
                      placeholder="Specialūs poreikiai, alergijos, kita svarbi informacija..."
                      class="form-input">{{ mokinys.pastabos if mokinys else '' }}</textarea>
        </div>

        <div class="flex gap-3 pt-4 border-t border-slate-100 dark:border-slate-700">
            <button type="submit" class="btn-primary">
                <i data-lucide="check" class="w-4 h-4"></i>
                {% if mokinys %}Išsaugoti{% else %}Pridėti mokinį{% endif %}
            </button>
            <a href="{{ url_for('students.saraso') }}" class="btn-secondary">Atšaukti</a>
        </div>
    </form>
</div>
{% endblock %}
