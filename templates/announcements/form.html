{% extends "base.html" %}

{% block title %}{% if skelbimas %}Redaguoti{% else %}Naujas{% endif %} skelbimas{% endblock %}

{% block content %}
<div class="mb-4">
    <a href="{{ url_for('announcements.saraso') }}" class="text-xs text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 inline-flex items-center gap-1">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
        Visi skelbimai
    </a>
</div>

<h1 class="text-xl font-semibold text-slate-900 dark:text-white tracking-tight mb-5">
    {% if skelbimas %}Redaguoti skelbimą{% else %}Naujas skelbimas{% endif %}
</h1>

<div class="card max-w-3xl">
    <div class="card-header">
        <h2>Skelbimo turinys</h2>
    </div>
    <form method="POST" class="p-5 space-y-4">
        <div>
            <label class="form-label">Pavadinimas <span class="text-red-500">*</span></label>
            <input type="text" name="pavadinimas" required maxlength="200"
                   value="{{ skelbimas.pavadinimas if skelbimas else '' }}"
                   placeholder="pvz., Posėdis penktadienį 14:00"
                   class="form-input">
        </div>

        <div>
            <label class="form-label">Turinys <span class="text-red-500">*</span></label>
            <textarea name="turinys" required rows="8"
                      placeholder="Detalus skelbimo turinys..."
                      class="form-input">{{ skelbimas.turinys if skelbimas else '' }}</textarea>
        </div>

        <div>
            <label class="form-label">Kategorija</label>
            <select name="kategorija" class="form-input">
                <option value="bendra" {% if skelbimas and skelbimas.kategorija == 'bendra' %}selected{% endif %}>Bendra informacija</option>
                <option value="renginiai" {% if skelbimas and skelbimas.kategorija == 'renginiai' %}selected{% endif %}>Renginiai</option>
                <option value="administracija" {% if skelbimas and skelbimas.kategorija == 'administracija' %}selected{% endif %}>Administracija</option>
                <option value="vgk" {% if skelbimas and skelbimas.kategorija == 'vgk' %}selected{% endif %}>Vaiko gerovės komisija</option>
                <option value="tevams" {% if skelbimas and skelbimas.kategorija == 'tevams' %}selected{% endif %}>Skirta tėvams</option>
                <option value="mokytojams" {% if skelbimas and skelbimas.kategorija == 'mokytojams' %}selected{% endif %}>Mokytojams</option>
            </select>
        </div>

        <div class="border-t border-slate-100 dark:border-slate-700 pt-4 space-y-3">
            <label class="flex items-start gap-3 cursor-pointer">
                <input type="checkbox" name="svarbus"
                       {% if skelbimas and skelbimas.svarbus %}checked{% endif %}
                       class="w-4 h-4 mt-0.5 rounded border-slate-300 dark:border-slate-600 text-brand-700 focus:ring-brand-700">
                <div>
                    <span class="text-sm font-medium text-slate-900 dark:text-white">Pažymėti kaip svarbų skelbimą</span>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Svarbūs skelbimai bus rodomi sąrašo viršuje su žyma</p>
                </div>
            </label>

            <label class="flex items-start gap-3 cursor-pointer">
                <input type="checkbox" name="matomas_tevams"
                       {% if skelbimas and skelbimas.matomas_tevams %}checked{% endif %}
                       class="w-4 h-4 mt-0.5 rounded border-slate-300 dark:border-slate-600 text-brand-700 focus:ring-brand-700">
                <div>
                    <span class="text-sm font-medium text-slate-900 dark:text-white">Matomas tėvams</span>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                        Kai pažymėta — skelbimas bus rodomas ir tėvų portale.
                        Nepažymėtas skelbimas matomas tik mokyklos darbuotojams.
                    </p>
                </div>
            </label>
        </div>

        <div class="flex gap-2 pt-3 border-t border-slate-100 dark:border-slate-700">
            <button type="submit" class="btn-primary">
                {% if skelbimas %}Išsaugoti pakeitimus{% else %}Paskelbti{% endif %}
            </button>
            <a href="{{ url_for('announcements.saraso') }}" class="btn-secondary">Atšaukti</a>
        </div>
    </form>
</div>
{% endblock %}
