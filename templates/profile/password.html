{% extends "base.html" %}

{% block title %}Keisti slaptažodį{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="{{ url_for('profile.index') }}" class="text-sm text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 flex items-center gap-1">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        Atgal į profilį
    </a>
</div>

<h1 class="text-3xl font-bold text-slate-900 dark:text-white mb-8">Keisti slaptažodį</h1>

<div class="card max-w-md">
    <form method="POST" class="p-6 space-y-5">

        <div>
            <label class="form-label">Senas slaptažodis <span class="text-red-500">*</span></label>
            <input type="password" name="senas_slaptazodis" required class="form-input">
        </div>

        <div>
            <label class="form-label">Naujas slaptažodis <span class="text-red-500">*</span></label>
            <input type="password" name="naujas_slaptazodis" required minlength="6" class="form-input">
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Mažiausiai 6 simboliai</p>
        </div>

        <div>
            <label class="form-label">Patvirtinkite naują slaptažodį <span class="text-red-500">*</span></label>
            <input type="password" name="patvirtinimas" required minlength="6" class="form-input">
        </div>

        <div class="flex gap-3 pt-4 border-t border-slate-100 dark:border-slate-700">
            <button type="submit" class="btn-primary">
                <i data-lucide="key" class="w-4 h-4"></i>
                Pakeisti slaptažodį
            </button>
            <a href="{{ url_for('profile.index') }}" class="btn-secondary">Atšaukti</a>
        </div>
    </form>
</div>
{% endblock %}
