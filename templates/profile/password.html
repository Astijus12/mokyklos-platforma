{% extends "base.html" %}

{% block title %}Keisti slaptažodį{% endblock %}

{% block content %}
<div class="mb-4">
    <a href="{{ url_for('profile.index') }}" class="text-xs text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 inline-flex items-center gap-1">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
        Mano profilis
    </a>
</div>

<h1 class="text-xl font-semibold text-slate-900 dark:text-white tracking-tight mb-5">Keisti slaptažodį</h1>

<div class="card max-w-md">
    <div class="card-header">
        <h2>Saugumas</h2>
    </div>
    <form method="POST" class="p-5 space-y-4">

        <div>
            <label class="form-label">Esamas slaptažodis <span class="text-red-500">*</span></label>
            <input type="password" name="senas_slaptazodis" required autocomplete="current-password" class="form-input">
        </div>

        <div>
            <label class="form-label">Naujas slaptažodis <span class="text-red-500">*</span></label>
            <input type="password" name="naujas_slaptazodis" required minlength="6" autocomplete="new-password" class="form-input">
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Mažiausiai 6 simboliai</p>
        </div>

        <div>
            <label class="form-label">Patvirtinkite naują slaptažodį <span class="text-red-500">*</span></label>
            <input type="password" name="patvirtinimas" required minlength="6" autocomplete="new-password" class="form-input">
        </div>

        <div class="flex gap-2 pt-3 border-t border-slate-100 dark:border-slate-700">
            <button type="submit" class="btn-primary">Pakeisti slaptažodį</button>
            <a href="{{ url_for('profile.index') }}" class="btn-secondary">Atšaukti</a>
        </div>
    </form>
</div>
{% endblock %}
