{% extends "base.html" %}

{% block title %}Redaguoti profilį{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="{{ url_for('profile.index') }}" class="text-sm text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 flex items-center gap-1">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        Atgal į profilį
    </a>
</div>

<h1 class="text-3xl font-bold text-slate-900 dark:text-white mb-8">Redaguoti profilį</h1>

<div class="card max-w-2xl">
    <form method="POST" class="p-6 space-y-5">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <div>
                <label class="form-label">Vardas <span class="text-red-500">*</span></label>
                <input type="text" name="vardas" required maxlength="80"
                       value="{{ current_user.vardas }}"
                       class="form-input">
            </div>
            <div>
                <label class="form-label">Pavardė <span class="text-red-500">*</span></label>
                <input type="text" name="pavarde" required maxlength="80"
                       value="{{ current_user.pavarde }}"
                       class="form-input">
            </div>
        </div>

        <div>
            <label class="form-label">El. paštas <span class="text-red-500">*</span></label>
            <input type="email" name="email" required maxlength="120"
                   value="{{ current_user.email }}"
                   class="form-input">
        </div>

        <div class="flex gap-3 pt-4 border-t border-slate-100 dark:border-slate-700">
            <button type="submit" class="btn-primary">
                <i data-lucide="check" class="w-4 h-4"></i>
                Išsaugoti
            </button>
            <a href="{{ url_for('profile.index') }}" class="btn-secondary">Atšaukti</a>
        </div>
    </form>
</div>
{% endblock %}
