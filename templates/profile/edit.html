{% extends "base.html" %}

{% block title %}Redaguoti profilį{% endblock %}

{% block content %}
<div class="mb-4">
    <a href="{{ url_for('profile.index') }}" class="text-xs text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 inline-flex items-center gap-1">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
        Mano profilis
    </a>
</div>

<h1 class="text-xl font-semibold text-slate-900 dark:text-white tracking-tight mb-5">Redaguoti profilį</h1>

<div class="card max-w-2xl">
    <div class="card-header">
        <h2>Asmens duomenys</h2>
    </div>
    <form method="POST" class="p-5 space-y-4">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="form-label">Vardas <span class="text-red-500">*</span></label>
                <input type="text" name="vardas" required maxlength="80"
                       value="{{ current_user.vardas }}"
                       class="form-input">
            </div>
            <div>
                <label class="form-label">Pavardė <span class="text-red-500">*</span></label>
                <input type="text" name="pavarde" required maxlength="80"
                       value="{{ current_user.pavarde }}"
                       class="form-input">
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="form-label">El. paštas <span class="text-red-500">*</span></label>
                <input type="email" name="email" required maxlength="120"
                       value="{{ current_user.email }}"
                       class="form-input">
            </div>
            <div>
                <label class="form-label">Telefonas</label>
                <input type="tel" name="telefonas" maxlength="30"
                       value="{{ current_user.telefonas or '' }}"
                       placeholder="+370..."
                       class="form-input">
            </div>
        </div>

        <div class="flex gap-2 pt-3 border-t border-slate-100 dark:border-slate-700">
            <button type="submit" class="btn-primary">Išsaugoti pakeitimus</button>
            <a href="{{ url_for('profile.index') }}" class="btn-secondary">Atšaukti</a>
        </div>
    </form>
</div>
{% endblock %}
