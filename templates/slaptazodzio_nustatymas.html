{% extends "base.html" %}

{% block title %}Slaptažodžio sukūrimas{% endblock %}

{% block auth_content %}
<div class="min-h-screen flex items-center justify-center p-4 bg-slate-50 dark:bg-slate-950">
    <div class="card w-full max-w-md">
        <div class="card-header"><h1 class="text-base font-semibold text-slate-900 dark:text-white">Sukurkite slaptažodį</h1></div>
        <form method="POST" class="p-5 space-y-4"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <p class="text-sm text-slate-600 dark:text-slate-400">
                Sveiki, {{ naudotojas.vardas }}. Jūsų paskyra tėvų portale: <strong>{{ naudotojas.email }}</strong>.
                Sukurkite slaptažodį (bent 8 simboliai).
            </p>
            <div>
                <label for="slaptazodis" class="form-label">Slaptažodis</label>
                <input type="password" id="slaptazodis" name="slaptazodis" required minlength="8" autocomplete="new-password" class="form-input">
            </div>
            <div>
                <label for="pakartotas" class="form-label">Pakartokite slaptažodį</label>
                <input type="password" id="pakartotas" name="pakartotas" required minlength="8" autocomplete="new-password" class="form-input">
            </div>
            <button type="submit" class="btn-primary w-full justify-center">Išsaugoti slaptažodį</button>
        </form>
    </div>
</div>
{% endblock %}
