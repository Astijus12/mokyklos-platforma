{% extends "base.html" %}

{% block title %}Įrašyti pažymį{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="{{ url_for('students.detales', mokinio_id=mokinys.id) }}" class="text-sm text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 flex items-center gap-1">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        Atgal į mokinio puslapį
    </a>
</div>

<h1 class="text-3xl font-bold text-slate-900 dark:text-white mb-2">Naujas pažymys</h1>
<p class="text-slate-500 dark:text-slate-400 mb-8">Mokinys: <strong class="text-slate-900 dark:text-white">{{ mokinys.pilnas_vardas }}</strong> ({{ mokinys.klase.pavadinimas }})</p>

<div class="card max-w-2xl">
    <form method="POST" class="p-6 space-y-5">

        <div>
            <label class="form-label">Dalykas <span class="text-red-500">*</span></label>
            <select name="dalykas" required class="form-input">
                <option value="">— Pasirinkite dalyką —</option>
                {% for d in dalykai %}
                <option value="{{ d }}">{{ d }}</option>
                {% endfor %}
            </select>
        </div>

        <div>
            <label class="form-label">Pažymys <span class="text-red-500">*</span></label>
            <div class="grid grid-cols-5 sm:grid-cols-10 gap-2">
                {% for i in range(1, 11) %}
                <label class="cursor-pointer">
                    <input type="radio" name="pazymys" value="{{ i }}" required class="peer sr-only">
                    <div class="aspect-square flex items-center justify-center rounded-lg border-2 border-slate-200 dark:border-slate-700 text-lg font-bold
                                peer-checked:border-primary-500 peer-checked:bg-primary-50 dark:peer-checked:bg-primary-900/40 peer-checked:text-primary-700 dark:peer-checked:text-primary-300
                                hover:border-primary-300 transition-colors">
                        {{ i }}
                    </div>
                </label>
                {% endfor %}
            </div>
        </div>

        <div>
            <label class="form-label">Data</label>
            <input type="date" name="data" value="{{ siandien }}" class="form-input">
        </div>

        <div>
            <label class="form-label">Komentaras</label>
            <input type="text" name="komentaras" maxlength="300"
                   placeholder="pvz., Kontrolinis darbas, Aktyvumas pamokoje..."
                   class="form-input">
        </div>

        <div class="flex gap-3 pt-4 border-t border-slate-100 dark:border-slate-700">
            <button type="submit" class="btn-primary">
                <i data-lucide="check" class="w-4 h-4"></i>
                Įrašyti pažymį
            </button>
            <a href="{{ url_for('students.detales', mokinio_id=mokinys.id) }}" class="btn-secondary">Atšaukti</a>
        </div>
    </form>
</div>
{% endblock %}
