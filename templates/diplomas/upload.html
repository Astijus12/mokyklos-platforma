{% extends "base.html" %}

{% block title %}Įkelti diplomą{% endblock %}

{% block content %}
<div class="mb-4">
    <a href="{{ url_for('diplomas.saraso') }}" class="text-xs text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 inline-flex items-center gap-1">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
        Visi diplomai
    </a>
</div>

<div class="mb-5">
    <h1 class="text-xl font-semibold text-slate-900 dark:text-white tracking-tight">Įkelti diplomą</h1>
    <p class="text-sm text-slate-500 dark:text-slate-400 mt-0.5">Įkelkite seminarų diplomus, pažymas ar sertifikatus</p>
</div>

<div class="card max-w-2xl">
    <div class="card-header">
        <h2>Dokumento informacija</h2>
    </div>
    <form method="POST" enctype="multipart/form-data" class="p-5 space-y-4">

        <div>
            <label class="form-label">Failas <span class="text-red-500">*</span></label>
            <label class="relative flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-md cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-800/50 hover:border-slate-400 dark:hover:border-slate-500 transition-colors">
                <div class="flex flex-col items-center justify-center pointer-events-none px-4 text-center">
                    <i data-lucide="upload-cloud" class="w-7 h-7 text-slate-400 mb-1.5"></i>
                    <p class="text-sm text-slate-600 dark:text-slate-300"><span class="font-medium">Spauskite, kad pasirinktumėte</span></p>
                    <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">PDF, PNG, JPG (iki 16 MB)</p>
                    <p class="text-xs text-brand-700 dark:text-brand-400 font-medium mt-1.5 hidden" id="failo-pavadinimas"></p>
                </div>
                <input type="file" name="failas" required accept=".pdf,.png,.jpg,.jpeg"
                       id="failo-input" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
            </label>
        </div>

        <div>
            <label class="form-label">Pavadinimas</label>
            <input type="text" name="pavadinimas" maxlength="200"
                   placeholder="pvz., Skaitmeninio raštingumo sertifikatas"
                   class="form-input">
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Jei paliksite tuščia, bus naudojamas failo pavadinimas</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
                <label class="form-label">Seminaras, renginys</label>
                <input type="text" name="seminaras" maxlength="200"
                       placeholder="pvz., IT mokytojų konferencija 2025"
                       class="form-input">
            </div>
            <div>
                <label class="form-label">Išdavimo data</label>
                <input type="date" name="isdavimo_data" class="form-input">
            </div>
        </div>

        <div>
            <label class="form-label">Aprašymas</label>
            <textarea name="aprasymas" rows="3"
                      placeholder="Trumpas aprašymas apie diplomą ar gautas kompetencijas..."
                      class="form-input"></textarea>
        </div>

        <div class="flex gap-2 pt-3 border-t border-slate-100 dark:border-slate-700">
            <button type="submit" class="btn-primary">
                <i data-lucide="upload" class="w-3.5 h-3.5"></i>
                Įkelti
            </button>
            <a href="{{ url_for('diplomas.saraso') }}" class="btn-secondary">Atšaukti</a>
        </div>
    </form>
</div>

<script>
    document.getElementById('failo-input').addEventListener('change', function(e) {
        const failas = e.target.files[0];
        const pav = document.getElementById('failo-pavadinimas');
        if (failas) {
            pav.textContent = '✓ ' + failas.name;
            pav.classList.remove('hidden');
        }
    });
</script>
{% endblock %}
