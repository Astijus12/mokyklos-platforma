{% extends "base.html" %}

{% block title %}Įkelti diplomą{% endblock %}

{% block content %}
<div class="mb-6">
    <a href="{{ url_for('diplomas.saraso') }}" class="text-sm text-slate-500 dark:text-slate-400 hover:text-slate-700 dark:hover:text-slate-200 flex items-center gap-1">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        Atgal į diplomų sąrašą
    </a>
</div>

<h1 class="text-3xl font-bold text-slate-900 dark:text-white mb-2">Įkelti diplomą</h1>
<p class="text-slate-500 dark:text-slate-400 mb-8">Įkelkite seminarų diplomus, pažymas ar sertifikatus</p>

<div class="card max-w-2xl">
    <form method="POST" enctype="multipart/form-data" class="p-6 space-y-5">

        <div>
            <label class="form-label">Failas <span class="text-red-500">*</span></label>
            <label class="relative flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-slate-300 dark:border-slate-600 rounded-xl cursor-pointer hover:bg-slate-50 dark:hover:bg-slate-700/50 hover:border-primary-400 transition-colors"
                   id="failo-drop-zona">
                <div class="flex flex-col items-center justify-center pt-5 pb-6 pointer-events-none">
                    <i data-lucide="upload-cloud" class="w-10 h-10 text-slate-400 mb-2"></i>
                    <p class="mb-1 text-sm text-slate-600 dark:text-slate-300"><span class="font-semibold">Spauskite, kad pasirinktumėte</span></p>
                    <p class="text-xs text-slate-500 dark:text-slate-400">PDF, PNG, JPG (max 16 MB)</p>
                    <p class="text-xs text-primary-600 dark:text-primary-400 font-medium mt-1 hidden" id="failo-pavadinimas"></p>
                </div>
                <input type="file" name="failas" required accept=".pdf,.png,.jpg,.jpeg"
                       id="failo-input" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
            </label>
        </div>

        <div>
            <label class="form-label">Pavadinimas</label>
            <input type="text" name="pavadinimas" maxlength="200"
                   placeholder="pvz., Skaitmeninio raštingumo sertifikatas"
                   class="form-input">
            <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Jei tuščia - bus naudojamas failo pavadinimas</p>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <div>
                <label class="form-label">Seminaras / Renginys</label>
                <input type="text" name="seminaras" maxlength="200"
                       placeholder="pvz., IT mokytojų konferencija 2025"
                       class="form-input">
            </div>
            <div>
                <label class="form-label">Išdavimo data</label>
                <input type="date" name="isdavimo_data" class="form-input">
            </div>
        </div>

        <div>
            <label class="form-label">Aprašymas</label>
            <textarea name="aprasymas" rows="3"
                      placeholder="Trumpas aprašymas apie diplomą ar gautas kompetencijas..."
                      class="form-input"></textarea>
        </div>

        <div class="flex gap-3 pt-4 border-t border-slate-100 dark:border-slate-700">
            <button type="submit" class="btn-primary">
                <i data-lucide="upload" class="w-4 h-4"></i>
                Įkelti
            </button>
            <a href="{{ url_for('diplomas.saraso') }}" class="btn-secondary">Atšaukti</a>
        </div>
    </form>
</div>

<script>
    document.getElementById('failo-input').addEventListener('change', function(e) {
        const failas = e.target.files[0];
        const pav = document.getElementById('failo-pavadinimas');
        if (failas) {
            pav.textContent = '✓ ' + failas.name;
            pav.classList.remove('hidden');
        }
    });
</script>
{% endblock %}
